<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>College Crafters — Your story. Unforgettable.</title>
    <meta
      name="description"
      content="College Crafters — admissions consulting for the USA, UK and Canada. We craft applications that open doors."
    />
    <meta name="theme-color" content="#0d7377" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="College Crafters" />
    <meta property="og:title" content="College Crafters — Your story. Unforgettable." />
    <meta property="og:description" content="We craft applications that open doors." />

    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="apple-touch-icon" href="assets/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/site.css" />
  </head>

  <body data-page="home" data-root="">
    <header data-site-header></header>

    <main id="main">
      <!-- ================= Hero ================= -->
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-art" aria-hidden="true">
          <img src="assets/hero-campus.jpg" alt="" width="1024" height="682" fetchpriority="high" />
        </div>

        <div class="wrap">
          <p class="pill hero-in">
            <svg class="i" aria-hidden="true"><use href="#i-sparkle"></use></svg>
            College Crafters · Admissions Consulting
          </p>

          <h1 class="hero-title hero-in hero-in-1" id="hero-title">
            <span class="t-teal">Your story.</span> <em class="t-peach">Unforgettable.</em>
          </h1>

          <p class="hero-sub hero-in hero-in-2">We craft applications that open doors.</p>

          <div class="hero-cta hero-in hero-in-3">
            <span class="booking booking--left" data-booking>
              <button class="btn btn-solid btn-lg" type="button" aria-haspopup="true" aria-expanded="false" data-booking-toggle>
                Book a Meeting
                <svg class="i i-chevron" aria-hidden="true"><use href="#i-chevron-down"></use></svg>
              </button>
              <span class="booking-menu" data-booking-menu hidden></span>
            </span>
            <a class="btn btn-ghost btn-lg" href="application-process/index.html">See our 5-step process</a>
          </div>

          <div class="hero-in hero-in-3" data-home="trust"></div>
        </div>
      </section>

      <!-- ================= Stats ================= -->
      <section class="section section--tint" aria-labelledby="stats-title">
        <div class="wrap">
          <h2 class="visually-hidden" id="stats-title">Our results</h2>
          <div data-home="stats"></div>
        </div>

        <!-- Full-bleed on purpose: the strip fades into the page margins. -->
        <div data-home="admits"></div>
      </section>

      <!-- ================= How we work ================= -->
      <section class="section section--white" id="how-we-work" aria-labelledby="work-title">
        <div class="wrap" data-home="work"></div>
      </section>

      <!-- ================= Old way vs new way ================= -->
      <section class="section section--tint" aria-labelledby="compare-title">
        <div class="wrap" data-home="compare"></div>
      </section>

      <!-- ================= Personas ================= -->
      <section class="section section--white" aria-labelledby="personas-title">
        <div class="wrap" data-home="personas"></div>
      </section>

      <!-- ================= Testimonials ================= -->
      <section class="section section--warm" aria-labelledby="quotes-title">
        <div class="wrap" data-home="quotes"></div>
      </section>

      <!-- ================= Final CTA ================= -->
      <div data-home="cta"></div>
    </main>

    <footer data-site-footer></footer>

    <script src="js/content.js"></script>
    <script src="js/nav-data.js"></script>
    <script src="js/page-content.js"></script>
    <script src="js/components.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/home.js"></script>
    <script src="js/site.js"></script>
  </body>
</html>
